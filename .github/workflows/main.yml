name: Maven Build and Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
          cache: maven

      - name: Build with Maven (PMD, SpotBugs, Site)
        run: mvn clean install pmd:pmd spotbugs:spotbugs package site

      - name: SonarQube Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_LOGIN_TOKEN }}
        run: |
          mvn sonar:sonar \
            -Dsonar.host.url=https://your-sonarqube-server.com \
            -Dsonar.login=$SONAR_TOKEN \
            -Dsonar.dependencyCheck.jsonReportPath=target/dependency-check-report.json \
            -Dsonar.dependencyCheck.xmlReportPath=target/dependency-check-report.xml \
            -Dsonar.dependencyCheck.htmlReportPath=target/dependency-check-report.html

      - name: Build and Push Container with Jib
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          mvn jib:build
